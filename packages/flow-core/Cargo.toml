[package]
name = "flow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust/WebAssembly compute engine for the visual-flow dataflow graph"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"